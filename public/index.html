<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="monetag" content="a20fefbe4065e0f3bda1131ba006a227">
  <title>Telegram Reward App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
      color:white;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:rgba(255,255,255,0.06);
      backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:20px;
      padding:25px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    h1{
      font-size:22px;
      margin-bottom:10px;
    }

    .user{
      opacity:0.8;
      margin-bottom:15px;
    }

    .balance-box{
      background:rgba(34,197,94,0.15);
      border:1px solid rgba(34,197,94,0.4);
      padding:15px;
      border-radius:15px;
      margin:20px 0;
    }

    .balance{
      font-size:32px;
      color:#22c55e;
      font-weight:bold;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      font-size:16px;
      font-weight:bold;
      color:white;
      background:linear-gradient(135deg,#22c55e,#16a34a);
      cursor:pointer;
      transition:0.2s;
    }

    button:active{
      transform:scale(0.97);
    }

    button:disabled{
      opacity:0.5;
      cursor:not-allowed;
    }

    .small{
      font-size:12px;
      opacity:0.7;
      margin-top:10px;
    }

    .info{
      margin-top:10px;
      font-size:13px;
      opacity:0.8;
    }

  </style>
</head>
<body>

<div class="card">

  <h1>💰 Telegram Reward App</h1>

  <div class="user" id="username">Loading...</div>

  <div class="balance-box">
    <div>Balance</div>
    <div class="balance">
      <span id="balance">0</span> Point
    </div>
  </div>

<button onclick="watchAd()">
  🎬 Tonton Iklan (+200)
</button>

  <div class="info" id="limitInfo">
    Sisa iklan hari ini: -
  </div>

  <div class="small" id="cooldownText">
    Siap menonton iklan
  </div>

</div>

<script>

const tg = window.Telegram.WebApp;
tg.expand();

const user = tg.initDataUnsafe.user;

const username = document.getElementById("username");
const balanceText = document.getElementById("balance");
const btn = document.getElementById("adBtn");
const cooldownText = document.getElementById("cooldownText");
const limitInfo = document.getElementById("limitInfo");

username.innerText = user?.first_name || "Guest";

let cooldown = false;
let cooldownTime = 15000;

async function watchAd(){

  // tampilkan iklan Monetag (otomatis dari script inject)
  let adLoaded = false;

  try {
    // trigger script Monetag (biasanya otomatis jalan)
    adLoaded = true;
  } catch(e){
    alert("Iklan belum siap");
    return;
  }

  // simulasi delay biar user benar-benar lihat iklan
  setTimeout(async () => {

    const res = await fetch('/api/reward', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        telegram_id:user?.id || 0
      })
    });

    const data = await res.json();

    balanceText.innerText = data.balance;

    limitInfo.innerText =
      "Sisa iklan hari ini: " + data.remaining_today;

    alert("+200 Point masuk 🎉");

  }, 5000); // 5 detik delay (anggap iklan selesai)

}

  if(cooldown) return;

  cooldown = true;
  btn.disabled = true;
  btn.innerText = "Loading iklan...";

  cooldownText.innerText = "Menyiapkan iklan...";

  setTimeout(async () => {

    try {

      const res = await fetch('/api/reward', {
        method:'POST',
        headers:{
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          telegram_id:user?.id || 0
        })
      });

      const data = await res.json();

      if(!res.ok){
        cooldownTime = data.cooldown || 15000;

        cooldownText.innerText =
          "Cooldown aktif: " + (data.cooldown_left || 15) + " detik";

        return;
      }

      balanceText.innerText = data.balance;

      limitInfo.innerText =
        "Sisa iklan hari ini: " + data.remaining_today;

      cooldownText.innerText =
        "Cooldown " + Math.ceil(cooldownTime/1000) + " detik";

      let timeLeft = cooldownTime / 1000;

      let interval = setInterval(() => {

        timeLeft--;

        cooldownText.innerText =
          "Cooldown: " + timeLeft + " detik";

        if(timeLeft <= 0){
          clearInterval(interval);
          cooldown = false;
          btn.disabled = false;
          btn.innerText = "🎬 Tonton Iklan (+200)";
          cooldownText.innerText = "Siap menonton iklan";
        }

      },1000);

    } catch(err){
      console.log(err);
      alert("Error server");
    }

  }, 1500);
}

</script>
<script>(function(s){s.dataset.zone='11068057',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</body>
</html>
