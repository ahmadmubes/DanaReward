<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- Monetag Verify -->
  <meta name="monetag" content="a20fefbe4065e0f3bda1131ba006a227">

  <title>Telegram Reward App</title>

  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag Multitag -->
  <script 
    src="https://quge5.com/88/tag.min.js"
    data-zone="243870"
    async
    data-cfasync="false">
  </script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
      color:white;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:420px;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.1);
      backdrop-filter:blur(10px);
      border-radius:20px;
      padding:25px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    h1{
      font-size:24px;
      margin-bottom:10px;
    }

    .user{
      opacity:0.8;
      margin-bottom:15px;
    }

    .balance-box{
      background:rgba(34,197,94,0.15);
      border:1px solid rgba(34,197,94,0.4);
      border-radius:15px;
      padding:15px;
      margin:20px 0;
    }

    .balance{
      font-size:32px;
      font-weight:bold;
      color:#22c55e;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:12px;
      font-size:16px;
      font-weight:bold;
      color:white;
      background:linear-gradient(135deg,#22c55e,#16a34a);
      cursor:pointer;
      transition:0.2s;
    }

    button:disabled{
      opacity:0.6;
      cursor:not-allowed;
    }

    button:active{
      transform:scale(0.97);
    }

    .info{
      margin-top:10px;
      font-size:13px;
      opacity:0.8;
    }

    .small{
      margin-top:10px;
      font-size:12px;
      opacity:0.6;
    }
  </style>
</head>

<body>

<div class="card">

  <h1>💰 Telegram Reward App</h1>

  <div class="user" id="username">
    Loading...
  </div>

  <div class="balance-box">
    <div>Balance</div>

    <div class="balance">
      <span id="balance">0</span> Point
    </div>
  </div>

  <button id="watchBtn" onclick="watchAd()">
    🎬 Tonton Iklan (+200)
  </button>

  <div class="info" id="limitInfo">
    Sisa iklan hari ini: -
  </div>

  <div class="small" id="cooldownText">
    Siap menonton iklan
  </div>

</div>

<script>

const tg = window.Telegram?.WebApp;

if(!tg){
  alert("Buka aplikasi dari Telegram bot");
}

tg?.expand();

const user = tg?.initDataUnsafe?.user || {
  id: 0,
  first_name: "Guest"
};

const username = document.getElementById("username");
const balanceText = document.getElementById("balance");
const limitInfo = document.getElementById("limitInfo");
const cooldownText = document.getElementById("cooldownText");
const btn = document.getElementById("watchBtn");

username.innerText = user.first_name;

let cooldown = false;
let cooldownTime = 15000;

function waitForMonetag(timeout = 5000){

  return new Promise((resolve) => {

    let t = 0;

    const interval = setInterval(() => {

      const scripts = document.querySelectorAll("script");

      const loaded = [...scripts].some(s =>
        s.src && s.src.includes("tag.min.js")
      );

      if(loaded){
        clearInterval(interval);
        resolve(true);
      }

      t += 500;

      if(t >= timeout){
        clearInterval(interval);
        resolve(false);
      }

    }, 500);

  });

}

async function watchAd(){

  if(cooldown) return;

  cooldown = true;

  btn.disabled = true;

  cooldownText.innerText = "Menyiapkan iklan...";

  try {

    const ready = await waitForMonetag();

    if(!ready){

      cooldownText.innerText = "Iklan belum tersedia";

      cooldown = false;
      btn.disabled = false;

      return;
    }

    // tunggu sedikit biar ads sempat render
    await new Promise(r => setTimeout(r, 2500));

    cooldownText.innerText = "Menampilkan iklan...";

    const res = await fetch('/api/reward', {

      method:'POST',

      headers:{
        'Content-Type':'application/json'
      },

      body:JSON.stringify({
        telegram_id: user.id
      })

    });

    const data = await res.json();

    if(!res.ok){

      alert(data.error || "Error");

      cooldown = false;
      btn.disabled = false;

      return;
    }

    balanceText.innerText = data.balance;

    limitInfo.innerText =
      "Sisa iklan hari ini: " + data.remaining_today;

    let timeLeft = cooldownTime / 1000;

    cooldownText.innerText =
      "Cooldown: " + timeLeft + " detik";

    const interval = setInterval(() => {

      timeLeft--;

      cooldownText.innerText =
        "Cooldown: " + timeLeft + " detik";

      if(timeLeft <= 0){

        clearInterval(interval);

        cooldown = false;

        btn.disabled = false;

        cooldownText.innerText =
          "Siap menonton iklan";
      }

    },1000);

  } catch(err){

    console.log(err);

    alert("Server error");

    cooldown = false;

    btn.disabled = false;
  }

}

</script>

</body>
</html>
