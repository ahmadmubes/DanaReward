<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Telegram Ads App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    body{
      background:#111827;
      color:white;
      font-family:Arial;
      text-align:center;
      padding:30px;
    }

    .card{
      background:#1f2937;
      border-radius:20px;
      padding:20px;
      max-width:400px;
      margin:auto;
      margin-top:50px;
    }

    button{
      background:#22c55e;
      color:white;
      border:none;
      padding:15px 25px;
      border-radius:12px;
      font-size:18px;
      cursor:pointer;
      width:100%;
    }

    .balance{
      font-size:28px;
      margin:20px 0;
      color:#22c55e;
    }

  </style>

</head>
<body>

<div class="card">

  <h1>Telegram Ads</h1>

  <h2 id="username">Loading...</h2>

  <div class="balance">
    <span id="balance">0</span> Point
  </div>

  <button onclick="watchAd()">
    Tonton Iklan
  </button>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.expand();

const user = tg.initDataUnsafe.user;

document.getElementById('username').innerText =
  user?.first_name || 'Guest';

let balance = 0;

async function watchAd(){

  alert('Simulasi iklan tampil');

  const res = await fetch('/api/reward', {
    method:'POST',
    headers:{
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      telegram_id:user?.id || 0
    })
  });

  const data = await res.json();

  balance = data.balance;

  document.getElementById('balance').innerText =
    balance;

  alert('+10 Point');
}

</script>

</body>
</html>
