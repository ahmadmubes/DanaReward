<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Loading Ads</title>

  <!-- Monetag verification -->
  <meta name="monetag" content="a20fefbe4065e0f3bda1131ba006a227">

  <!-- Monetag Script -->
  <script 
    src="https://quge5.com/88/tag.min.js"
    data-zone="243870"
    async
    data-cfasync="false">

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background:#0f172a;
      color:white;
      font-family:Arial;
      text-align:center;
    }

    .box{
      padding:20px;
      border:1px solid rgba(255,255,255,0.1);
      border-radius:15px;
      background:rgba(255,255,255,0.05);
    }

    h2{
      margin-bottom:10px;
    }

    p{
      opacity:0.7;
      font-size:14px;
    }

    .loader{
      margin-top:15px;
      width:30px;
      height:30px;
      border:3px solid rgba(255,255,255,0.2);
      border-top-color:#22c55e;
      border-radius:50%;
      animation:spin 1s linear infinite;
    }

    @keyframes spin{
      to{ transform:rotate(360deg); }
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Loading Ads...</h2>
    <p>Silakan tunggu beberapa detik</p>
