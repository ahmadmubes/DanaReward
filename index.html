<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <meta name="monetag" content="a20fefbe4065e0f3bda1131ba006a227">

  <title>Reward App</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0f172a;
      color:white;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      width:90%;
      max-width:420px;
      background:rgba(255,255,255,0.05);
      padding:20px;
      border-radius:15px;
      text-align:center;
    }

    button{
      width:100%;
      padding:15px;
      border:none;
      border-radius:10px;
      background:#22c55e;
      color:white;
      font-weight:bold;
      cursor:pointer;
    }

    .balance{
      font-size:30px;
      margin:15px 0;
    }

    .info{
      margin-top:10px;
      font-size:13px;
      opacity:0.7;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>💰 Reward App</h2>

  <div id="username">Loading...</div>

  <div class="balance">
    <span id="balance">0</span> Point
  </div>

  <button id="btn" onclick="watchAd()">🎬 Tonton Iklan (+200)</button>

  <div class="info" id="info">Siap menonton iklan</div>

</div>

<script>

const tg = window.Telegram?.WebApp;
tg?.expand();

const user = tg?.initDataUnsafe?.user || { id:0, first_name:"Guest" };

document.getElementById("username").innerText = user.first_name;

const btn = document.getElementById("btn");
const balanceEl = document.getElementById("balance");
const info = document.getElementById("info");

let cooldown = false;

async function watchAd(){

  if(cooldown) return;

  cooldown = true;
  btn.disabled = true;

  info.innerText = "Membuka iklan...";

  // 🔥 FLAG SYSTEM START
  localStorage.setItem("ads_status", "watching");

  window.open("/ads.html", "_blank");

  info.innerText = "Tunggu iklan selesai...";

  const check = setInterval(async () => {

    if(localStorage.getItem("ads_status") === "done"){

      clearInterval(check);

      localStorage.removeItem("ads_status");

      const res = await fetch("/api/reward", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ telegram_id: user.id })
      });

      const data = await res.json();

      if(res.ok){
        balanceEl.innerText = data.balance;
      }

      cooldown = false;
      btn.disabled = false;
      info.innerText = "Siap menonton iklan";
    }

  }, 2000);

}

</script>

</body>
</html>
